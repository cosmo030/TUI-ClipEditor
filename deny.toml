# cargo-deny configuration: vulnerability advisories, licenses, banned
# crates, and allowed sources. Run with `scripts/check.sh deny`.

[graph]
all-features = true

[advisories]
version = 2
# Every advisory (vulnerability, unmaintained, unsound) fails the check.
# Dismiss a false positive only with `ignore = [{ id = "...", reason = "..." }]`.
yanked = "deny"

[licenses]
version = 2
# Permissive licenses approved by the project owner. Adding a license here is
# a decision for the owner; copyleft licenses need review first.
allow = [
    "MIT",
    "Apache-2.0",
    # unicode-ident (via serde/thiserror derive macros): compile-time only,
    # OSI-approved permissive license.
    "Unicode-3.0",
    # foldhash (hash function used by ratatui's hashbrown): OSI-approved
    # permissive license.
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
