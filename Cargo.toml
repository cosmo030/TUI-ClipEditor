[package]
name = "tui-clip-editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A terminal video clip editor: scrub, mark in/out points, and export clips with ffmpeg."
license = "MIT OR Apache-2.0"
repository = "https://github.com/cosmo030/TUI-ClipEditor"
readme = "README.md"
keywords = ["tui", "video", "ffmpeg", "clip", "editor"]
categories = ["command-line-utilities", "multimedia::video"]
publish = false

[[bin]]
name = "clipedit"
path = "src/main.rs"

[dependencies]
image = { version = "0.25.10", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Complexity limits are set in clippy.toml.
cognitive_complexity = "warn"
too_many_lines = "warn"
# Debug output must not be committed; intentional user-facing output uses a
# narrow, justified `#[expect]`.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Errors must be handled, not unwrapped, outside tests (see clippy.toml).
unwrap_used = "warn"
todo = "warn"
unimplemented = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
tempfile = "3.27.0"
